name: Setup project
description: Install Node.js and pnpm, and install dependencies
runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v6.1.0
          with:
              version: 11
        - uses: actions/setup-node@v7.1.0
          with:
              node-version: 24
              cache: pnpm
        - run: pnpm install --frozen-lockfile
          shell: bash --noprofile --norc -e -o pipefail {0}
